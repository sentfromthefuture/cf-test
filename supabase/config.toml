# The collect function authenticates itself (shared secret for the scheduler, admin check for manual sync),
# so the platform-level JWT check must be off.
[functions.collect]
verify_jwt = false

# Blueprint uses an end-user JWT; unlike the scheduler-only collector, platform JWT verification stays enabled.
[functions.blueprint]
verify_jwt = true
