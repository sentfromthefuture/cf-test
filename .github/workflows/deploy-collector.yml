name: Deploy collect Edge Function

# Deploys supabase/functions/collect to the Supabase project whenever the collector code changes on main,
# and on demand from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-collector.yml'
  workflow_dispatch:

concurrency:
  group: deploy-collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check required repository secrets
        run: |
          missing=0
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is missing"; missing=1; }
          [ -n "$SUPABASE_PROJECT_REF" ] || { echo "::error::Repository secret SUPABASE_PROJECT_REF is missing"; missing=1; }
          exit $missing

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # The function authenticates its own callers (scheduler secret or admin JWT), so the platform JWT check is off.
      - name: Deploy collect
        run: supabase functions deploy collect --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
